name: Build GSI from Firmware

on:
  workflow_dispatch:
    inputs:
      firmware_url:
        description: "Firmware direct download link (required)"
        required: true
        type: string
      rom_name:
        description: "Build name (short, alphanumeric)"
        required: true
        type: string
        default: "gsi-build"
      rom_type:
        description: "ROM type (e.g. miui, hyperos, pixel; default: auto)"
        required: false
        type: string
        default: "auto"
      compress:
        description: "Compress output to .zip (recommended)"
        required: false
        type: boolean
        default: true
      no_merge:
        description: "Build separate partition images instead of merging"
        required: false
        type: boolean
        default: false
      no_debloat:
        description: "Skip debloating (keep all stock apps)"
        required: false
        type: boolean
        default: false

concurrency:
  group: build-${{ github.event.inputs.rom_name }}-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build GSI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "requirements.txt"

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            aria2 \
            openssl \
            patch \
            ca-certificates \
            libarchive-tools \
            default-jre-headless

      - name: Download firmware from direct link
        env:
          FIRMWARE_URL: ${{ github.event.inputs.firmware_url }}
          WORK_DIR: tmp/${{ github.event.inputs.rom_name }}
        run: |
          mkdir -p "$WORK_DIR"
          # Extract filename from URL
          FIRMWARE_NAME=$(basename "$FIRMWARE_URL" | sed 's/[?].*//')
          # Download with aria2 for speed and resume support
          aria2c -x16 -s16 --continue=true \
            --dir="$WORK_DIR" \
            --out="$FIRMWARE_NAME" \
            "$FIRMWARE_URL"
          # Verify download succeeded
          if [ ! -f "$WORK_DIR/$FIRMWARE_NAME" ]; then
            echo "::error::Firmware download failed - file not found"
            exit 1
          fi
          echo "FIRMWARE_FILE=$WORK_DIR/$FIRMWARE_NAME" >> $GITHUB_ENV
          echo "FIRMWARE_NAME=$FIRMWARE_NAME" >> $GITHUB_ENV
          echo "Downloaded: $FIRMWARE_NAME"
          ls -lh "$WORK_DIR/$FIRMWARE_NAME"

      - name: Build GSI
        env:
          FIRMWARE_FILE: ${{ env.FIRMWARE_FILE }}
          ROM_NAME: ${{ github.event.inputs.rom_name }}
          ROM_TYPE: ${{ github.event.inputs.rom_type }}
        run: |
          python cli.py build "$ROM_NAME" "$FIRMWARE_FILE" \
            --type "$ROM_TYPE" \
            ${{ github.event.inputs.compress == true && '--compress' || '' }} \
            ${{ github.event.inputs.no_merge == true && '--no-merge' || '' }} \
            ${{ github.event.inputs.no_debloat == true && '--no-debloat' || '' }}

      - name: Clean up original firmware package after extraction
        env:
          ROM_NAME: ${{ github.event.inputs.rom_name }}
          FIRMWARE_NAME: ${{ env.FIRMWARE_NAME }}
        run: |
          WORK_DIR="tmp/$ROM_NAME"
          if [ -f "$WORK_DIR/$FIRMWARE_NAME" ]; then
            echo "Cleaning up original firmware package: $FIRMWARE_NAME"
            rm -f "$WORK_DIR/$FIRMWARE_NAME"
            echo "Removed: $WORK_DIR/$FIRMWARE_NAME"
          else
            echo "Firmware package not found (already cleaned), skipping"
          fi
          echo "Remaining files in $WORK_DIR:"
          ls -la "$WORK_DIR/"

      - name: List build output
        env:
          ROM_NAME: ${{ github.event.inputs.rom_name }}
        run: |
          echo "=== Build output ==="
          ls -lh "out/$ROM_NAME/" || true
          echo ""
          echo "=== output.txt ==="
          cat "out/$ROM_NAME/output.txt" || true

      - name: Upload to GitHub Releases (mandatory)
        env:
          ROM_NAME: ${{ github.event.inputs.rom_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          OUTPUT_DIR="out/$ROM_NAME"

          # Collect all release assets
          ASSETS=()
          if [ -f "$OUTPUT_DIR/*.zip" ]; then
            ZIP_FILE=$(ls "$OUTPUT_DIR"/*.zip 2>/dev/null | head -1)
            if [ -n "$ZIP_FILE" ]; then
              ASSETS+=("$ZIP_FILE")
              echo "Found zip: $ZIP_FILE"
            fi
          fi

          # Also upload individual images if no zip
          if [ ${#ASSETS[@]} -eq 0 ]; then
            for img in "$OUTPUT_DIR"/*.img; do
              if [ -f "$img" ]; then
                ASSETS+=("$img")
                echo "Found image: $img"
              fi
            done
          fi

          # output.txt is always included
          if [ -f "$OUTPUT_DIR/output.txt" ]; then
            echo "Found output.txt"
          fi

          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::error::No build artifacts found to upload - build may have failed"
            exit 1
          fi

          # Create release title from output.txt or fallback
          RELEASE_TITLE="GSI Build: $ROM_NAME"
          if [ -f "$OUTPUT_DIR/output.txt" ]; then
            RELEASE_TITLE=$(head -1 "$OUTPUT_DIR/output.txt" | sed 's/<[^>]*>//g')
          fi

          RELEASE_BODY=$(cat "$OUTPUT_DIR/output.txt" 2>/dev/null || echo "GSI build for $ROM_NAME")

          # Create or update release
          RELEASE_RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/releases" \
            -d "{
              \"tag_name\": \"build-$ROM_NAME-$(date +%Y%m%d-%H%M%S)\",
              \"name\": \"$RELEASE_TITLE\",
              \"body\": $(echo "$RELEASE_BODY" | python3 -c "import sys,json; print(json.dumps(sys.stdin.read()))"),
              \"draft\": false,
              \"prerelease\": false
            }")

          UPLOAD_URL=$(echo "$RELEASE_RESPONSE" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('upload_url',''))")
          if [ -z "$UPLOAD_URL" ] || [ "$UPLOAD_URL" = "" ]; then
            echo "::error::Failed to create release"
            echo "Response: $RELEASE_RESPONSE"
            exit 1
          fi

          echo "Release created: $RELEASE_RESPONSE"

          # Upload each asset
          for asset in "${ASSETS[@]}"; do
            ASSET_NAME=$(basename "$asset")
            echo "Uploading: $ASSET_NAME"
            curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: $(file -b --mime-type "$asset")" \
              --data-binary @"$asset" \
              "$UPLOAD_URL?name=$ASSET_NAME" \
              || echo "::warning::Failed to upload $ASSET_NAME"
          done

          # Also upload output.txt
          if [ -f "$OUTPUT_DIR/output.txt" ]; then
            echo "Uploading output.txt"
            curl -s -X POST \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: text/plain" \
              --data-binary @"$OUTPUT_DIR/output.txt" \
              "$UPLOAD_URL?name=output.txt" \
              || echo "::warning::Failed to upload output.txt"
          fi

          echo "✅ Build artifacts uploaded to GitHub Releases successfully"

      - name: Cleanup workspace
        env:
          ROM_NAME: ${{ github.event.inputs.rom_name }}
        run: |
          echo "=== Final cleanup ==="
          # Keep out/ for artifacts, clean tmp/ except the extracted images
          # Remove any leftover download artifacts
          find tmp -name "*.zip" -delete 2>/dev/null || true
          find tmp -name "*.aria2" -delete 2>/dev/null || true
          echo "Workspace cleanup complete"
          echo "Output directory:"
          ls -lh "out/$ROM_NAME/" 2>/dev/null || echo "No output found"
